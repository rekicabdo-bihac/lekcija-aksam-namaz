let stage=0,index=0,points=0,lock=false,selection=null,used=[],orderPos=0,quiz=[],recognition=[],currentAnswer="",pairItems=[],pairSelected=null,paired=new Set();const $=id=>document.getElementById(id);const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};let audio;function sound(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(ok?650:240,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?950:130,audio.currentTime+.16);g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.23);o.start();o.stop(audio.currentTime+.24)}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStage(n){stage=n;index=0;points=0;lock=false;selection=null;used=[];orderPos=0;paired=new Set();pairSelected=null;quiz=shuffle(facts).slice(0,n===6?50:12);recognition=shuffle(steps).slice(0,12);if(n===1){pairItems=shuffle([0,1,2,3,4,5,6,7].flatMap(i=>[{id:i,type:'a',text:steps[i][0]},{id:i,type:'b',text:steps[i][1]}]))}render()}function nav(){ $('stages').innerHTML=stages.map((s,i)=>`<button class="stage ${stage===i?'active':''}" onclick="setStage(${i})">${i+1}. ${s}</button>`).join('')};function head(title,sub=''){return `<h2>${title}</h2>${sub?`<p class="hint">${sub}</p>`:''}`};function bar(done,total){return `<div class="score"><span>Napredak: ${done}/${total}</span><span>⭐ ${points} bodova</span></div><div class="meter"><span style="width:${100*done/total}%"></span></div>`}function actions(next=true){return `<div class="controls"><button class="btn secondary" onclick="setStage(${stage})">↻ Ponovi etapu</button>${next?`<button class="btn" onclick="setStage(${Math.min(6,stage+1)})">Sljedeća etapa →</button>`:''}</div>`}function finish(){return head('🎉 Bravo! Etapa završena!')+`<p>Osvojeno bodova: <b>${points}</b>.</p>`+actions(stage<6)}function render(){nav();lock=false;let p=$('panel');if(stage===0){p.innerHTML=head('📖 NAUČI','Dodirni „Sljedeće“ i upoznaj redoslijed akšam-namaza.')+bar(index,steps.length)+(index<steps.length?`<div class="lesson"><h2>${esc(steps[index][0])}</h2><p>${esc(steps[index][1])}</p></div><p class="hint">Korak ${index+1} od ${steps.length}. Akšam: prvo 3 farza (prvo sjedenje poslije 2. rekata), zatim 2 sunneta.</p><div class="controls"><button class="btn secondary" onclick="index=Math.max(0,index-1);render()">← Nazad</button><button class="btn" onclick="index++;render()">${index===steps.length-1?'Završi učenje ✓':'Sljedeće →'}</button></div>`:finish());return}if(stage===1){if(paired.size===8){p.innerHTML=finish();return}p.innerHTML=head('🔗 SPOJI','Pronađi par: naziv radnje i njeno objašnjenje. Odaberi dvije kartice.')+bar(paired.size,8)+`<div class="answers">${pairItems.map((a,i)=>paired.has(a.id)?`<button class="answer correct" disabled>✓ Spojeno</button>`:`<button class="answer ${pairSelected===i?'chosen':''}" onclick="pairClick(${i})">${esc(a.text)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;return}if(stage===2){const seq=steps.map((_,i)=>i);if(orderPos===seq.length){p.innerHTML=finish();return}if(!used.length)used=shuffle(seq);p.innerHTML=head('🧩 SLOŽI REDOM','Dodiruj kartice redom kako se obavlja akšam-namaz.')+bar(orderPos,seq.length)+`<p class="prompt">Odaberi korak broj ${orderPos+1}:</p><div class="answers">${shuffle([orderPos,...shuffle(used.filter(i=>i!==orderPos)).slice(0,3)]).map(i=>`<button class="answer" onclick="orderClick(${i})">${esc(steps[i][0])}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;return}if(stage===3){if(index>=steps.length){p.innerHTML=finish();return}let correct=index,choices=shuffle([correct,...shuffle(steps.map((_,i)=>i).filter(i=>i!==correct)).slice(0,3)]);currentAnswer=steps[correct][0];p.innerHTML=head('❓ ŠTA NEDOSTAJE?','Pronađi nedostajući korak u redoslijedu.')+bar(index,steps.length)+`<p class="prompt">${index?esc(steps[index-1][0]):'POČETAK'} → ❓ → ${index<steps.length-1?esc(steps[index+1][0]):'KRAJ'}</p><div class="answers">${choices.map(i=>`<button class="answer" onclick="check(${i===correct},this,currentAnswer)">${esc(steps[i][0])}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;return}if(stage===4){if(index>=12){p.innerHTML=finish();return}let a=recognition[index];p.innerHTML=head('💡 PREPOZNAJ PO ZNAČENJU','Pročitaj objašnjenje i pronađi odgovarajući pojam.')+bar(index,12)+`<p class="prompt">${esc(a[1])}</p><div class="answers">${shuffle([a[0],...shuffle(steps.filter(s=>s[0]!==a[0])).slice(0,3).map(s=>s[0])]).map(x=>`<button class="answer" onclick="check(${x===a[0]},this,'${esc(a[0])}')">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;return}if(stage===5||stage===6){if(index>=quiz.length){p.innerHTML=finish();return}let f=quiz[index];currentAnswer=f[1];p.innerHTML=head(stage===5?'⚡ BRZI IZAZOV':'🏆 ZAVRŠNI ISPIT',stage===5?'12 pitanja za uvježbavanje.':'50 pitanja • tačno +10, netačno −3 • bez vremenskog ograničenja.')+bar(index,quiz.length)+`<p class="prompt">${index+1}. ${esc(f[0])}</p><div class="answers">${shuffle([f[1],...f[2]]).map(x=>`<button class="answer" onclick="check(${x===f[1]},this,currentAnswer)">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`;return}}
function pairClick(i){if(lock)return;const a=pairItems[i];if(pairSelected===null){pairSelected=i;render();return}if(i===pairSelected){pairSelected=null;render();return}const b=pairItems[pairSelected];if(a.id===b.id&&a.type!==b.type){paired.add(a.id);points+=10;sound(true);pairSelected=null;render()}else{points-=3;sound(false);$('feedback').textContent='Pokušaj ponovo! −3 boda';pairSelected=null;setTimeout(()=>{if(stage===1)render()},550)}}function orderClick(i){if(lock)return;if(i===orderPos){points+=10;orderPos++;used=used.filter(x=>x!==i);sound(true);render()}else{points-=3;sound(false);$('feedback').textContent='Nije taj korak. Pokušaj ponovo! −3 boda'}}function check(ok,el,answer){if(lock)return;lock=true;points+=ok?10:-3;sound(ok);el.classList.add(ok?'correct':'wrong');$('feedback').textContent=ok?'✓ Tačno! +10 bodova':'✗ Netačno! −3 boda. Tačno: '+answer;setTimeout(()=>{index++;render()},1050)}setStage(0);
</script></body></html>
